services:
  - type: web
    name: skill-assessment-system
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: skill-assessment-system-db
          property: connectionString
      - key: AI_PROVIDER
        value: none

databases:
  - name: skill-assessment-system-db
    databaseName: skill_assessment_system
    user: skill_assessment_system
    plan: free
    region: oregon
